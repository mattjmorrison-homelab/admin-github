name: Fix repo rename state (one-time)

on:
  workflow_dispatch:

jobs:
  fix-state:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@58daf722248c6ba7c9308cf67b6ec3dd58ddff39
        with:
          needs-github-token: "true"
      - run: tofu init
      - run: bash scripts/fix-repo-rename-state.sh
