name: Clear repo state

# One-time re-baseline tool (see _imports_generated.tf and README's rename
# incident notes). Manually triggered only, and gated on typing the
# confirmation phrase so a stray "Run workflow" click can't wipe real state.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAR to wipe github_repository/github_branch_protection state'
        required: true

jobs:
  clear-state:
    if: github.event.inputs.confirm == 'CLEAR'
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: make
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@58daf722248c6ba7c9308cf67b6ec3dd58ddff39
        with:
          needs-github-token: "true"
      - run: tofu init
      - run: make clear-repo-state
