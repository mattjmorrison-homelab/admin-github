name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: k8s-amd64
    # Pilot (todo #17): this job authenticates to OpenBao via GitHub's own
    # OIDC token instead of the Kubernetes-auth JWT every other job in this
    # repo still uses -- id-token: write is what lets this job request one.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - name: Format check
        run: tofu fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - run: tflint --init
      - run: tflint
      # Pilot (todo #17): fetches AWS creds + GITHUB_TOKEN via GitHub OIDC
      # + OpenBao's jwt auth method instead of actions-tofu/fetch-credentials'
      # usual Kubernetes-auth login -- same 3 KV keys, same end result, only
      # the login mechanism differs. Inline for now, not yet a reusable
      # action (this is the first and only repo using this path; worth
      # generalizing once a second repo migrates, not before).
      - name: Fetch credentials via GitHub OIDC + OpenBao jwt auth (pilot)
        env:
          VAULT_ADDR: http://k8s-openbao.openbao.svc:8200
        run: |
          GH_OIDC_TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -r '.value')

          CLIENT_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
            -d "$(jq -nc --arg jwt "$GH_OIDC_TOKEN" '{jwt: $jwt, role: "admin-github-oidc"}')" \
            | jq -r '.auth.client_token')

          fetch_secret() {
            curl -sf -H "X-Vault-Token: $CLIENT_TOKEN" \
              "$VAULT_ADDR/v1/kv/data/homelab/service/k8s-garage/admin-github/$1" \
              | jq -r '.data.data.value'
          }
          fetch_admin_github_secret() {
            curl -sf -H "X-Vault-Token: $CLIENT_TOKEN" \
              "$VAULT_ADDR/v1/kv/data/homelab/admin-github/$1" \
              | jq -r '.data.data.value'
          }

          ACCESS_KEY_ID=$(fetch_secret tofu-state-access-key-id)
          SECRET_ACCESS_KEY=$(fetch_secret tofu-state-secret-access-key)
          GH_ORG_TOKEN=$(fetch_admin_github_secret github-token)

          echo "::add-mask::$ACCESS_KEY_ID"
          echo "::add-mask::$SECRET_ACCESS_KEY"
          echo "::add-mask::$GH_ORG_TOKEN"
          echo "AWS_ACCESS_KEY_ID=$ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=$GH_ORG_TOKEN" >> "$GITHUB_ENV"
      - run: tofu init
      - run: tofu plan -out=tfplan
      - uses: mattjmorrison-homelab/actions-tofu/upload-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-github-tofu-state

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: mattjmorrison-homelab/actions-tofu/fetch-credentials@ee8759dc24664be5d19aef68d09032e7eb08169e # main
        with:
          role: admin-github-tofu-state
          kv-prefix: service/k8s-garage/admin-github
          needs-github-token: "true"
      - uses: mattjmorrison-homelab/actions-tofu/download-plan@c4253df5832781cf10d3b5dda78c135e6eed2a6b
        with:
          key: plans/${{ github.repository }}/${{ github.event.pull_request.head.sha }}/tfplan
          bucket: admin-github-tofu-state
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.12.0"
          tofu_wrapper: false
      - run: tofu init
      - run: tofu apply -auto-approve tfplan
